name: CPU harness tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Python regression suite
        run: python3 -m unittest discover -s tests -v
      - name: Verify published evidence receipts
        run: python3 scripts/export_evidence.py --verify evidence/snapshot
      - name: Verify maintenance evidence and replay actual GPU outputs offline
        run: |
          python3 scripts/export_evidence.py --verify evidence/maintenance-20260907
          python3 audit.py evidence/maintenance-20260907/single-gpu
